[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-design-council"
version = "0.1.0"
description = "Multi-agent AI design council: independent proposals, cross-review, devil's advocate, defense, and moderated consensus for software design decisions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=1.4"]  # needs messages.parse()/output_format (structured outputs)
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["council*"]

[tool.setuptools.package-data]
council = ["agents/roles/*.yaml", "agents/skills.yaml", "agents/role_skill_overrides.json", "web/templates/*.html", "web/static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
